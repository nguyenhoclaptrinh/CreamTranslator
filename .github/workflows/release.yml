name: Publish Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: release-pipeline
  cancel-in-progress: false

jobs:
  release:
    name: Build & Publish Release APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build Release APK
        run: |
          BUILD_NUM="${GITHUB_RUN_NUMBER}"
          TAG_NAME="v1.0.${BUILD_NUM}"
          echo "Building Release APK for version ${TAG_NAME} (versionCode: ${BUILD_NUM})..."
          ./gradlew assembleRelease
          mkdir -p dist
          cp app/build/outputs/apk/release/*.apk "dist/CreamTranslator-${TAG_NAME}.apk"
          echo "RELEASE_APK=dist/CreamTranslator-${TAG_NAME}.apk" >> $GITHUB_ENV
          echo "TAG_NAME=${TAG_NAME}" >> $GITHUB_ENV

      - name: Create GitHub Release & Tag
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          files: ${{ env.RELEASE_APK }}
          generate_release_notes: true
          name: "CreamTranslator ${{ env.TAG_NAME }}"
