name: Publish Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v1.1.0)'
        required: true
        default: 'v1.1.0'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Mount RAM Disk for Build Output
        run: |
          sudo mkdir -p app/build
          sudo mount -t tmpfs -o size=2048m tmpfs app/build

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build Release APK
        run: |
          TAG_NAME="${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || github.event.inputs.tag_name }}"
          echo "Packaging Release APK for tag ${TAG_NAME}..."
          ./gradlew assembleRelease -PappTag="${TAG_NAME}"
          VERSION_NAME=$(./gradlew -q printAppVersion -PappTag="${TAG_NAME}" | grep 'APP_VERSION_NAME=' | cut -d'=' -f2)
          mkdir -p dist
          cp app/build/outputs/apk/release/*.apk "dist/CreamTranslator-${TAG_NAME}.apk"
          cd dist
          sha256sum "CreamTranslator-${TAG_NAME}.apk" > "CreamTranslator-${TAG_NAME}.apk.sha256"
          cd ..
          echo "RELEASE_APK=dist/CreamTranslator-${TAG_NAME}.apk" >> $GITHUB_ENV
          echo "RELEASE_SHA=dist/CreamTranslator-${TAG_NAME}.apk.sha256" >> $GITHUB_ENV
          echo "TAG_NAME=${TAG_NAME}" >> $GITHUB_ENV

      - name: Create GitHub Release & Tag
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: "CreamTranslator ${{ env.TAG_NAME }}"
          files: |
            ${{ env.RELEASE_APK }}
            ${{ env.RELEASE_SHA }}
          generate_release_notes: true
