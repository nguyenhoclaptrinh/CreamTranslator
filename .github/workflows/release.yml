name: Publish Release

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - 'LICENSE'
  workflow_dispatch:

concurrency:
  group: release-pipeline
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  validate:
    name: Pre-Release Quality Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Verify Quality Gate & Unit Tests
        run: ./gradlew spotlessCheck detekt lintDebug testDebugUnitTest --continue

  release:
    name: Build & Publish Release APK
    needs: validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build Release APK
        run: |
          ./gradlew assembleRelease
          VERSION_NAME=$(./gradlew -q printAppVersion | grep 'APP_VERSION_NAME=' | cut -d'=' -f2)
          TAG_NAME="v${VERSION_NAME}"
          echo "Packaging Release APK for version ${TAG_NAME}..."
          mkdir -p dist
          cp app/build/outputs/apk/release/*.apk "dist/CreamTranslator-${TAG_NAME}.apk"
          cd dist
          sha256sum "CreamTranslator-${TAG_NAME}.apk" > "CreamTranslator-${TAG_NAME}.apk.sha256"
          cd ..
          echo "RELEASE_APK=dist/CreamTranslator-${TAG_NAME}.apk" >> $GITHUB_ENV
          echo "RELEASE_SHA=dist/CreamTranslator-${TAG_NAME}.apk.sha256" >> $GITHUB_ENV
          echo "TAG_NAME=${TAG_NAME}" >> $GITHUB_ENV

      - name: Create GitHub Release & Tag
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: "CreamTranslator ${{ env.TAG_NAME }}"
          files: |
            ${{ env.RELEASE_APK }}
            ${{ env.RELEASE_SHA }}
          generate_release_notes: true
