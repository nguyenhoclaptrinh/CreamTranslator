<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B132B" />
      <stop offset="100%" stop-color="#1C2541" />
    </linearGradient>

    <!-- Popsicle Body - Two Tone Translation Gradient -->
    <!-- Left side: Pure Cream Vanilla -->
    <linearGradient id="creamLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#FFF3D6" />
      <stop offset="100%" stop-color="#FDE68A" />
    </linearGradient>

    <!-- Right side: Cyan Tech Neon (Translated) -->
    <linearGradient id="techRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <!-- Popsicle Stick Wood Gradient -->
    <linearGradient id="stickGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D97706" />
      <stop offset="50%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>

    <!-- Drop Shadows & Glow -->
    <filter id="iceGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#0284C7" flood-opacity="0.45" />
    </filter>
    <filter id="crispShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- App Squircle Base (Dark Obsidian) -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#bgGradient)" stroke="#334155" stroke-width="4" />

  <!-- Ambient Light Pulse -->
  <circle cx="256" cy="230" r="150" fill="#00E5FF" opacity="0.1" filter="blur(50px)" />

  <!-- Group: Complete Popsicle Icon -->
  <g filter="url(#iceGlow)" transform="translate(0, -10)">
    
    <!-- 1. Wooden Popsicle Stick -->
    <rect x="232" y="340" width="48" height="90" rx="24" fill="url(#stickGrad)" filter="url(#crispShadow)" />

    <!-- 2. Main Ice Cream Bar (Popsicle Shape with Smooth Rounded Top) -->
    <g filter="url(#crispShadow)">
      <!-- Left Half: Creamy Vanilla (Source Language) -->
      <path d="M 160 200 C 160 120, 256 120, 256 120 L 256 350 L 180 350 C 169 350, 160 341, 160 330 Z" 
            fill="url(#creamLeft)" />

      <!-- Right Half: Neon Cyan Tech Glaze (Translated Language) -->
      <path d="M 256 120 C 256 120, 352 120, 352 200 L 352 330 C 352 341, 343 350, 332 350 L 256 350 Z" 
            fill="url(#techRight)" />

      <!-- High-gloss diagonal reflection shine on the cream bar -->
      <path d="M 185 180 C 185 145, 215 135, 240 132 L 235 155 C 220 158, 202 165, 200 185 Z" 
            fill="#FFFFFF" opacity="0.65" />
    </g>

    <!-- 3. Central Translation Glyph & HUD Target Line -->
    <!-- Scanning laser beam divider -->
    <line x1="256" y1="120" x2="256" y2="350" stroke="#FFFFFF" stroke-width="3" opacity="0.8" />

    <!-- Left Source Letter 'A' (Clean Minimalist Font) -->
    <text x="206" y="255" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
          font-size="44" font-weight="900" fill="#1E293B" text-anchor="middle">A</text>

    <!-- Right Target Vietnamese Character 'Á' (Glowing White) -->
    <text x="306" y="255" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
          font-size="44" font-weight="900" fill="#FFFFFF" text-anchor="middle">Á</text>

    <!-- Two-way Curved Translation Transfer Arrows -->
    <g stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <!-- Top transfer arc -->
      <path d="M 226 210 Q 256 195 286 210" stroke="#0284C7" />
      <polyline points="280,202 286,210 278,216" stroke="#0284C7" />

      <!-- Bottom transfer arc -->
      <path d="M 286 270 Q 256 285 226 270" stroke="#FDE68A" />
      <polyline points="232,264 226,270 234,278" stroke="#FDE68A" />
    </g>

    <!-- 4. Cute Melting Cream Glaze Accent (Giọt kem ngọt ngào chảy nhẹ) -->
    <path d="M 240 350 C 240 365, 256 365, 256 350 Z" fill="url(#creamLeft)" />
  </g>

  <!-- Sparkles -->
  <polygon points="380,120 385,135 400,140 385,145 380,160 375,145 360,140 375,135" fill="#38BDF8" opacity="0.85" />
</svg>
