<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Cream Gradient -->
    <linearGradient id="creamGrad" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="40%" stop-color="#FFF5E5" />
      <stop offset="100%" stop-color="#FED7AA" />
    </linearGradient>

    <!-- Accent Cyan Gradient -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0284C7" flood-opacity="0.35" />
    </filter>
    <filter id="creamShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Base Squircle with Glowing Border -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="url(#bgGrad)" stroke="#1E293B" stroke-width="6" />

  <!-- Ambient Light Circle -->
  <circle cx="256" cy="256" r="180" fill="#0284C7" opacity="0.12" filter="blur(40px)" />

  <!-- Stylized Speech Bubble Base -->
  <g filter="url(#softGlow)">
    <path d="M 140 180 C 140 140, 372 140, 372 180 L 372 320 C 372 360, 300 360, 260 360 L 210 395 C 195 405, 185 395, 190 380 L 195 360 L 170 360 C 140 360, 140 320, 140 320 Z" 
          fill="#1E293B" stroke="url(#cyanGrad)" stroke-width="4" />
  </g>

  <!-- Gourmet Soft-serve Cream Swirl (Layered 3D) -->
  <g filter="url(#creamShadow)">
    <!-- Bottom Swirl Layer -->
    <path d="M 175 320 C 160 320, 160 285, 185 280 C 220 270, 290 270, 325 280 C 350 285, 350 320, 335 320 C 300 330, 210 330, 175 320 Z" 
          fill="url(#creamGrad)" />

    <!-- Middle Swirl Layer -->
    <path d="M 195 282 C 180 280, 185 250, 205 245 C 235 238, 275 238, 305 245 C 325 250, 330 280, 315 282 C 285 275, 225 275, 195 282 Z" 
          fill="url(#creamGrad)" />

    <!-- Top Swirl Peak -->
    <path d="M 220 246 C 210 240, 215 215, 230 210 C 245 205, 265 205, 280 210 C 295 215, 300 240, 290 246 C 275 242, 235 242, 220 246 Z" 
          fill="#FFFFFF" />

    <!-- Swirl Delicate Tip (Whipped Cream Peak) -->
    <path d="M 248 210 C 242 195, 252 175, 268 185 C 272 192, 262 205, 256 210 Z" 
          fill="#FFFDF5" />
  </g>

  <!-- Cyan Glowing Translation Arrows inside Dialogue Bubble -->
  <g transform="translate(186, 215)">
    <!-- Arrow 1 (Left to Right) -->
    <path d="M 15 25 L 85 25 M 65 10 L 85 25 L 65 40" 
          fill="none" stroke="#00E5FF" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Arrow 2 (Right to Left) -->
    <path d="M 125 55 L 55 55 M 75 40 L 55 55 L 75 70" 
          fill="none" stroke="#38BDF8" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Subtle Sparkling Star Accent -->
  <path d="M 360 150 Q 370 160 380 160 Q 370 160 360 170 Q 350 160 340 160 Q 350 160 360 150 Z" 
        fill="#FDE047" opacity="0.9" />
</svg>
