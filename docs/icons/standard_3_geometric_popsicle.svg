<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background: Sweet Anime Peach Blossom Gradient -->
    <linearGradient id="std3_bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE4E6" />
      <stop offset="100%" stop-color="#FEF3C7" />
    </linearGradient>

    <!-- Geometric Popsicle Top Half: Cream Milk White -->
    <linearGradient id="std3_cream" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#FFFBEB" />
    </linearGradient>

    <!-- Geometric Popsicle Bottom Half: Anime Strawberry Pink -->
    <linearGradient id="std3_berry" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FB7185" />
      <stop offset="100%" stop-color="#E11D48" />
    </linearGradient>

    <!-- Rounded Popsicle Stick -->
    <linearGradient id="std3_stick" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <filter id="std3_shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#FB7185" flood-opacity="0.3" />
    </filter>
  </defs>

  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#std3_bg)" stroke="#FFFFFF" stroke-width="6" />

  <g filter="url(#std3_shadow)" transform="translate(0, -10)">
    <!-- 1. Wooden Stick (Strict Standard Geometry) -->
    <rect x="234" y="325" width="44" height="85" rx="22" fill="url(#std3_stick)" />

    <!-- 2. Pure Geometric Popsicle Body -->
    <!-- Bottom Half: Strawberry (Chữ nhật bo góc đáy) -->
    <path d="M 170 230 L 342 230 L 342 315 C 342 332, 328 345, 310 345 L 202 345 C 184 345, 170 332, 170 315 Z" 
          fill="url(#std3_berry)" />

    <!-- Top Half: Pure Vanilla Cream (Bán nguyệt bo tròn đỉnh hoàn hảo) -->
    <path d="M 170 230 L 342 230 L 342 205 C 342 120, 170 120, 170 205 Z" 
          fill="url(#std3_cream)" />

    <!-- Wavy Glaze Transition between Top and Bottom -->
    <path d="M 170 230 Q 212 250 256 230 Q 300 210 342 230 L 342 245 Q 300 225 256 245 Q 212 265 170 245 Z" 
          fill="#FFFFFF" />

    <!-- 3. Minimalist Translation Cutout at Center (Bold & Iconic) -->
    <!-- Top Glyph 'C' for Cream -->
    <text x="256" y="200" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
          font-size="54" font-weight="900" fill="#E11D48" text-anchor="middle">C</text>

    <!-- Bottom Glyph 'T' for Translator -->
    <text x="256" y="315" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
          font-size="54" font-weight="900" fill="#FFFFFF" text-anchor="middle">T</text>
  </g>

  <!-- Clean Anime Twinkle Star -->
  <polygon points="380,95 385,107 398,112 385,117 380,129 375,117 362,112 375,107" fill="#F59E0B" />
</svg>
