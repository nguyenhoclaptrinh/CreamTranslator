<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Bright Anime Pastel Gradient Background -->
    <linearGradient id="ani1_bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE4E6" />
      <stop offset="50%" stop-color="#FCE7F3" />
      <stop offset="100%" stop-color="#E0E7FF" />
    </linearGradient>

    <!-- Fresh Cream White Gradient -->
    <linearGradient id="ani1_cream" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#FFF1F2" />
    </linearGradient>

    <!-- Strawberry Glaze Syrup Gradient -->
    <linearGradient id="ani1_syrup" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FB7185" />
      <stop offset="100%" stop-color="#E11D48" />
    </linearGradient>

    <!-- Glass Cup Gradient -->
    <linearGradient id="ani1_cup" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#BAE6FD" stop-opacity="0.4" />
    </linearGradient>

    <!-- Pocky Stick Gradient -->
    <linearGradient id="ani1_pocky" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F472B6" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>

    <filter id="softAnimeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#FDA4AF" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Bright Rounded Squircle Base -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#ani1_bg)" stroke="#FFFFFF" stroke-width="8" />

  <!-- Soft Pink Floating Glow -->
  <circle cx="256" cy="256" r="160" fill="#FDA4AF" opacity="0.3" filter="blur(30px)" />

  <g filter="url(#softAnimeShadow)" transform="translate(0, -10)">
    <!-- 2 Crossed Pocky Sticks (Bánh que Pocky dâu đan chéo tạo thành chữ X / dịch thuật) -->
    <rect x="150" y="80" width="16" height="220" rx="8" fill="url(#ani1_pocky)" transform="rotate(-28 158 190)" />
    <rect x="150" y="240" width="16" height="60" rx="4" fill="#FDE047" transform="rotate(-28 158 270)" />

    <rect x="346" y="80" width="16" height="220" rx="8" fill="url(#ani1_pocky)" transform="rotate(28 354 190)" />
    <rect x="346" y="240" width="16" height="60" rx="4" fill="#FDE047" transform="rotate(28 354 270)" />

    <!-- Parfait Glass Bowl (Ly thủy tinh Parfait) -->
    <ellipse cx="256" cy="405" rx="55" ry="12" fill="#E2E8F0" />
    <rect x="248" y="340" width="16" height="65" rx="8" fill="#CBD5E1" />
    <path d="M 170 240 Q 170 340 256 340 Q 342 340 342 240 Z" fill="url(#ani1_cup)" stroke="#38BDF8" stroke-width="4" />

    <!-- Layered Dessert inside glass -->
    <path d="M 185 285 Q 256 300 327 285 L 320 330 Q 256 342 192 330 Z" fill="#FB7185" />
    <path d="M 178 260 Q 256 272 334 260 L 328 285 Q 256 300 184 285 Z" fill="#FEF08A" />

    <!-- Big Fluffy Whipped Cream Cloud (Đám mây kem tươi bông xốp) -->
    <circle cx="210" cy="225" r="42" fill="url(#ani1_cream)" stroke="#FFE4E6" stroke-width="2" />
    <circle cx="302" cy="225" r="42" fill="url(#ani1_cream)" stroke="#FFE4E6" stroke-width="2" />
    <circle cx="256" cy="195" r="48" fill="#FFFFFF" stroke="#FFE4E6" stroke-width="2" />

    <!-- Drizzling Strawberry Syrup (Sốt dâu chảy bóng bẩy) -->
    <path d="M 215 195 Q 235 220 256 205 Q 275 220 295 195 Q 280 230 256 220 Q 230 230 215 195 Z" fill="url(#ani1_syrup)" />

    <!-- Cute Anime Strawberry on Top (Quả dâu tây tươi mọng) -->
    <path d="M 256 128 C 235 128, 230 165, 256 182 C 282 165, 277 128, 256 128 Z" fill="#E11D48" />
    <!-- Strawberry Leaves -->
    <polygon points="256,128 244,118 256,122 268,118" fill="#22C55E" />
    <!-- Strawberry Seeds -->
    <circle cx="250" cy="148" r="2" fill="#FEF08A" />
    <circle cx="262" cy="148" r="2" fill="#FEF08A" />
    <circle cx="256" cy="162" r="2" fill="#FEF08A" />

    <!-- Translation HUD Badge on Front (Huy hiệu dịch thuật tròn xinh xắn) -->
    <circle cx="256" cy="285" r="34" fill="#FFFFFF" stroke="#F43F5E" stroke-width="3" />
    <!-- Two Cute Translation Curved Arrows -->
    <path d="M 238 278 Q 256 268 274 278" stroke="#0284C7" stroke-width="3.5" stroke-linecap="round" fill="none" />
    <polyline points="270,272 274,278 268,283" stroke="#0284C7" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    
    <path d="M 274 292 Q 256 302 238 292" stroke="#E11D48" stroke-width="3.5" stroke-linecap="round" fill="none" />
    <polyline points="242,287 238,292 244,298" stroke="#E11D48" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  </g>

  <!-- Anime Twinkle Sparkles (Ngôi sao lấp lánh kiểu Anime) -->
  <polygon points="120,130 126,145 141,151 126,157 120,172 114,157 99,151 114,145" fill="#FBBF24" />
  <polygon points="390,140 394,150 404,154 394,158 390,168 386,158 376,154 386,150" fill="#F43F5E" />
  <circle cx="360" cy="110" r="6" fill="#60A5FA" />
</svg>
