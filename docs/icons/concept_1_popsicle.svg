<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="c1_bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B132B" />
      <stop offset="100%" stop-color="#1C2541" />
    </linearGradient>
    <linearGradient id="c1_cream" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#FFF3D6" />
      <stop offset="100%" stop-color="#FDE68A" />
    </linearGradient>
    <linearGradient id="c1_neon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <linearGradient id="c1_stick" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D97706" />
      <stop offset="50%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>
    <filter id="c1_glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#0284C7" flood-opacity="0.4" />
    </filter>
  </defs>

  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#c1_bg)" stroke="#334155" stroke-width="4" />
  <circle cx="256" cy="220" r="140" fill="#00E5FF" opacity="0.1" filter="blur(40px)" />

  <g filter="url(#c1_glow)" transform="translate(0, -10)">
    <!-- Wooden Stick -->
    <rect x="232" y="340" width="48" height="90" rx="24" fill="url(#c1_stick)" />

    <!-- Ice Cream Bar -->
    <!-- Left Half: Cream -->
    <path d="M 160 200 C 160 120, 256 120, 256 120 L 256 350 L 180 350 C 169 350, 160 341, 160 330 Z" fill="url(#c1_cream)" />
    <!-- Right Half: Cyan Glaze -->
    <path d="M 256 120 C 256 120, 352 120, 352 200 L 352 330 C 352 341, 343 350, 332 350 L 256 350 Z" fill="url(#c1_neon)" />

    <!-- Divider Laser -->
    <line x1="256" y1="120" x2="256" y2="350" stroke="#FFFFFF" stroke-width="3" opacity="0.8" />

    <!-- Translation Characters -->
    <text x="206" y="255" font-family="sans-serif" font-size="44" font-weight="900" fill="#1E293B" text-anchor="middle">A</text>
    <text x="306" y="255" font-family="sans-serif" font-size="44" font-weight="900" fill="#FFFFFF" text-anchor="middle">Á</text>

    <!-- Transfer Arc Arrows -->
    <path d="M 226 210 Q 256 195 286 210" stroke="#0284C7" stroke-width="4" stroke-linecap="round" fill="none" />
    <path d="M 286 270 Q 256 285 226 270" stroke="#FDE68A" stroke-width="4" stroke-linecap="round" fill="none" />

    <!-- Melting Cream Drip -->
    <path d="M 240 350 C 240 366, 256 366, 256 350 Z" fill="url(#c1_cream)" />
  </g>
</svg>
