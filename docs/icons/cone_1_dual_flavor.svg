<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Bright Anime Sky Blue Gradient Background -->
    <linearGradient id="cone1_bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E0F2FE" />
      <stop offset="60%" stop-color="#EFF6FF" />
      <stop offset="100%" stop-color="#FFE4E6" />
    </linearGradient>

    <!-- Golden Crispy Waffle Cone Gradient -->
    <linearGradient id="cone1_waffle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <!-- Vanilla Cream Left Gradient -->
    <linearGradient id="cone1_vanilla" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#FFFBEB" />
    </linearGradient>

    <!-- Strawberry Cream Right Gradient -->
    <linearGradient id="cone1_berry" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FDA4AF" />
      <stop offset="100%" stop-color="#FB7185" />
    </linearGradient>

    <filter id="cone1_shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#F43F5E" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- App Squircle Base (108dp Android Container) -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#cone1_bg)" stroke="#FFFFFF" stroke-width="8" />

  <!-- Soft Ambient Glow -->
  <circle cx="256" cy="240" r="160" fill="#FDE68A" opacity="0.35" filter="blur(40px)" />

  <g filter="url(#cone1_shadow)" transform="translate(0, -6)">
    <!-- 1. CRISPY WAFFLE CONE (Bánh ốc quế giòn tan) -->
    <!-- Cone Body -->
    <path d="M 172 260 L 340 260 L 264 425 C 260 433, 252 433, 248 425 Z" 
          fill="url(#cone1_waffle)" stroke="#B45309" stroke-width="3" />

    <!-- Waffle Diamond Crosshatch Grid Lines (Vân lưới ca rô nướng giòn) -->
    <g stroke="#78350F" stroke-width="2.5" opacity="0.35" stroke-linecap="round">
      <!-- Diagonals Left to Right -->
      <line x1="190" y1="260" x2="260" y2="415" />
      <line x1="220" y1="260" x2="270" y2="370" />
      <line x1="250" y1="260" x2="295" y2="350" />
      <line x1="280" y1="260" x2="315" y2="320" />

      <!-- Diagonals Right to Left -->
      <line x1="322" y1="260" x2="252" y2="415" />
      <line x1="292" y1="260" x2="242" y2="370" />
      <line x1="262" y1="260" x2="217" y2="350" />
      <line x1="232" y1="260" x2="197" y2="320" />
    </g>

    <!-- 2. SOFT-SERVE CREAM SWIRL LAYERS (Các tầng kem xoắn mượt mà) -->
    <!-- Bottom Swirl Tier (Tầng kem đáy tràn miệng ốc quế) -->
    <path d="M 160 265 C 150 250, 160 220, 190 220 C 220 220, 292 220, 322 220 C 352 220, 362 250, 352 265 C 342 278, 320 272, 256 272 C 192 272, 170 278, 160 265 Z" 
          fill="#FFFBEB" stroke="#FDE68A" stroke-width="3" />

    <!-- Left Fluffy Swirl Scoop: Vanilla Cream -->
    <path d="M 175 225 C 165 195, 185 160, 220 160 C 245 160, 256 180, 256 220 L 175 225 Z" 
          fill="url(#cone1_vanilla)" />

    <!-- Right Fluffy Swirl Scoop: Strawberry Pink Cream -->
    <path d="M 256 160 C 290 160, 345 195, 335 225 L 256 220 L 256 160 Z" 
          fill="url(#cone1_berry)" />

    <!-- Middle Swirl Tier (Tầng kem xoắn giữa) -->
    <path d="M 188 175 C 180 150, 205 125, 235 125 C 265 125, 305 130, 322 155 C 330 170, 320 185, 300 185 C 275 185, 235 185, 188 175 Z" 
          fill="#FFFFFF" stroke="#FECDD3" stroke-width="2" />

    <!-- Top Delicate Whipped Peak (Đỉnh xoắn kem cong nhẹ đáng yêu) -->
    <path d="M 230 130 C 225 110, 240 85, 260 75 C 265 73, 270 76, 268 82 C 262 95, 275 105, 272 120 Z" 
          fill="#FFFDF7" stroke="#FECDD3" stroke-width="2" />

    <!-- 3. TRANSLATION HUD BADGE ACROSS SWIRL (Huy hiệu dịch thuật chuyển ngữ) -->
    <!-- Glowing Translation Badge -->
    <g transform="translate(0, 10)">
      <rect x="176" y="195" width="160" height="52" rx="26" fill="#FFFFFF" stroke="#0284C7" stroke-width="3.5" />

      <!-- Left Source Character 'A' -->
      <text x="210" y="232" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
            font-size="28" font-weight="900" fill="#E11D48" text-anchor="middle">A</text>

      <!-- Central Animated Exchange Arrows -->
      <path d="M 236 221 L 274 221 M 264 213 L 274 221 L 264 229" 
            stroke="#0284C7" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />

      <!-- Right Target Character 'Á' -->
      <text x="300" y="232" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
            font-size="28" font-weight="900" fill="#0284C7" text-anchor="middle">Á</text>
    </g>

    <!-- Cute Rainbow Sprinkles on the Cream (Cốm màu anime) -->
    <rect x="200" y="145" width="10" height="4" rx="2" fill="#38BDF8" transform="rotate(25 205 147)" />
    <rect x="290" y="140" width="10" height="4" rx="2" fill="#F43F5E" transform="rotate(-30 295 142)" />
    <rect x="235" y="105" width="10" height="4" rx="2" fill="#FBBF24" transform="rotate(45 240 107)" />
  </g>

  <!-- Anime Twinkle Sparkles -->
  <polygon points="100,120 105,132 118,137 105,142 100,154 95,142 82,137 95,132" fill="#F59E0B" />
  <polygon points="400,140 404,150 414,154 404,158 400,168 396,158 386,154 396,150" fill="#FB7185" />
</svg>
