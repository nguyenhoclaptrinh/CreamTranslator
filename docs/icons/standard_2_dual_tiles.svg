<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background: Bright Anime Vanilla & Mint Gradient -->
    <linearGradient id="std2_bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EFF6FF" />
      <stop offset="50%" stop-color="#F0FDF4" />
      <stop offset="100%" stop-color="#FEF9C3" />
    </linearGradient>

    <!-- Back Tile: Cyan Mint Anime Translation Layer -->
    <linearGradient id="std2_tile1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <!-- Front Tile: Cream Strawberry Milk Surface -->
    <linearGradient id="std2_tile2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#FFF1F2" />
    </linearGradient>

    <filter id="std2_shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#0284C7" flood-opacity="0.25" />
    </filter>
    <filter id="std2_frontShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="-4" dy="12" stdDeviation="12" flood-color="#000000" flood-opacity="0.15" />
    </filter>
  </defs>

  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#std2_bg)" stroke="#FFFFFF" stroke-width="6" />

  <g transform="translate(0, -5)">
    <!-- Back Tile (Source Language Tile - Cyan Mint) -->
    <g filter="url(#std2_shadow)">
      <rect x="180" y="110" width="190" height="210" rx="36" fill="url(#std2_tile1)" />
      <!-- High-visibility Source Glyph 'EN' -->
      <text x="275" y="195" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
            font-size="64" font-weight="900" fill="#FFFFFF" text-anchor="middle">A</text>
    </g>

    <!-- Front Tile (Target Language Tile - Soft Vanilla Cream with Strawberry border) -->
    <g filter="url(#std2_frontShadow)">
      <rect x="140" y="190" width="190" height="210" rx="36" fill="url(#std2_tile2)" stroke="#FDA4AF" stroke-width="4" />
      <!-- Target Glyph 'VI' in Vibrant Strawberry Red -->
      <text x="235" y="315" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
            font-size="74" font-weight="900" fill="#E11D48" text-anchor="middle">Á</text>

      <!-- Cream Drop Accent on Front Tile (Top-Left Corner) -->
      <path d="M 176 190 C 176 210, 196 210, 196 190 Z" fill="#FDA4AF" />
    </g>

    <!-- Central Connecting Translation Ring (Geometric Pivot) -->
    <circle cx="256" cy="256" r="32" fill="#FFFFFF" stroke="#0284C7" stroke-width="5" />
    <!-- Dynamic Circular Exchange Arrows -->
    <path d="M 242 250 A 14 14 0 0 1 268 246 L 268 240 L 274 248 L 266 254 L 266 248" 
          fill="#0284C7" />
    <path d="M 270 262 A 14 14 0 0 1 244 266 L 244 272 L 238 264 L 246 258 L 246 264" 
          fill="#E11D48" />
  </g>
</svg>
