<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Bright Cheerful Anime Sky Gradient -->
    <linearGradient id="ani4_bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#BAE6FD" />
      <stop offset="50%" stop-color="#E0F2FE" />
      <stop offset="100%" stop-color="#FDE68A" />
    </linearGradient>

    <!-- Popsicle Layers: Strawberry -> Mango -> Mint -->
    <linearGradient id="ani4_pink" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FB7185" />
      <stop offset="100%" stop-color="#F43F5E" />
    </linearGradient>
    <linearGradient id="ani4_yellow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <linearGradient id="ani4_mint" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6EE7B7" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>

    <!-- Natural Wood Stick -->
    <linearGradient id="ani4_wood" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>

    <filter id="ani4_shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#F59E0B" flood-opacity="0.35" />
    </filter>
  </defs>

  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#ani4_bg)" stroke="#FFFFFF" stroke-width="8" />

  <g filter="url(#ani4_shadow)" transform="translate(0, -10)">
    <!-- Wooden Stick (Que kem gỗ) -->
    <rect x="232" y="340" width="48" height="95" rx="24" fill="url(#ani4_wood)" stroke="#B45309" stroke-width="2" />

    <!-- Popsicle Body (Thân kem que 3 tầng hương vị anime tươi mát) -->
    <!-- Layer 3: Mint Green Bottom (Tầng bạc hà) -->
    <path d="M 160 270 L 352 270 L 352 330 C 352 342, 342 352, 330 352 L 182 352 C 170 352, 160 342, 160 330 Z" fill="url(#ani4_mint)" />

    <!-- Layer 2: Mango Yellow Middle (Tầng xoài vàng chanh) -->
    <rect x="160" y="200" width="192" height="70" fill="url(#ani4_yellow)" />

    <!-- Layer 1: Strawberry Pink Top (Tầng dâu tây hồng) -->
    <path d="M 160 200 L 352 200 L 352 190 C 352 110, 160 110, 160 190 Z" fill="url(#ani4_pink)" />

    <!-- Melting Pure White Vanilla Cream Dip on Top (Lớp kem sữa vani trắng tan chảy phủ trên đỉnh) -->
    <path d="M 160 185 C 160 115, 352 115, 352 185 C 330 185, 320 215, 300 200 C 280 185, 260 225, 240 200 C 220 185, 200 220, 180 195 C 170 185, 160 195, 160 185 Z" fill="#FFFFFF" />

    <!-- Holographic Translation Bubble across the Center (Khung dịch thuật hình bong bóng nước) -->
    <rect x="180" y="222" width="152" height="66" rx="20" fill="#FFFFFF" opacity="0.95" stroke="#38BDF8" stroke-width="4" />
    <!-- Character 'A' -> 'Á' inside -->
    <text x="216" y="266" font-family="sans-serif" font-size="34" font-weight="900" fill="#E11D48" text-anchor="middle">A</text>
    <path d="M 242 255 L 268 255 M 262 249 L 268 255 L 262 261" stroke="#38BDF8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <text x="294" y="266" font-family="sans-serif" font-size="34" font-weight="900" fill="#0284C7" text-anchor="middle">Á</text>
  </g>

  <!-- Bright Anime Sparkles -->
  <polygon points="380,100 386,114 400,120 386,126 380,140 374,126 360,120 374,114" fill="#FFFFFF" />
  <polygon points="100,140 104,150 114,154 104,158 100,168 96,158 86,154 96,150" fill="#F43F5E" />
</svg>
