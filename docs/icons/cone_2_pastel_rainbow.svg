<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Sakura Anime Gradient Background -->
    <linearGradient id="cone2_bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF1F2" />
      <stop offset="50%" stop-color="#FFE4E6" />
      <stop offset="100%" stop-color="#FEF9C3" />
    </linearGradient>

    <!-- Waffle Cone Gradient -->
    <linearGradient id="cone2_waffle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <!-- Triple Swirl Rainbow Layers -->
    <linearGradient id="swirl_pink" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FDA4AF" />
      <stop offset="100%" stop-color="#FB7185" />
    </linearGradient>
    <linearGradient id="swirl_vanilla" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#FEF3C7" />
    </linearGradient>
    <linearGradient id="swirl_cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7DD3FC" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <filter id="cone2_shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#F43F5E" flood-opacity="0.3" />
    </filter>
  </defs>

  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#cone2_bg)" stroke="#FFFFFF" stroke-width="8" />

  <g filter="url(#cone2_shadow)" transform="translate(0, -6)">
    <!-- 1. CRISPY WAFFLE CONE WITH FLUTED RIM -->
    <!-- Waffle Body -->
    <path d="M 175 250 L 337 250 L 264 425 C 260 433, 252 433, 248 425 Z" 
          fill="url(#cone2_waffle)" stroke="#B45309" stroke-width="3" />

    <!-- Waffle Cone Grid Pattern -->
    <g stroke="#92400E" stroke-width="2.5" opacity="0.35">
      <line x1="195" y1="250" x2="260" y2="415" />
      <line x1="225" y1="250" x2="275" y2="370" />
      <line x1="255" y1="250" x2="300" y2="350" />
      <line x1="285" y1="250" x2="320" y2="320" />

      <line x1="317" y1="250" x2="252" y2="415" />
      <line x1="287" y1="250" x2="237" y2="370" />
      <line x1="257" y1="250" x2="212" y2="350" />
      <line x1="227" y1="250" x2="192" y2="320" />
    </g>

    <!-- 2. SOFT PASTEL SWIRL TIERS -->
    <!-- Swirl Tier 1: Strawberry Pink (Bottom) -->
    <path d="M 160 250 C 150 230, 170 205, 210 205 C 240 205, 270 205, 302 205 C 342 205, 362 230, 352 250 C 342 265, 310 260, 256 260 C 202 260, 170 265, 160 250 Z" 
          fill="url(#swirl_pink)" stroke="#F43F5E" stroke-width="2" />

    <!-- Swirl Tier 2: Pure Vanilla Cream (Middle) -->
    <path d="M 178 210 C 170 185, 195 160, 230 160 C 260 160, 285 160, 315 175 C 335 185, 335 210, 310 215 C 285 220, 220 220, 178 210 Z" 
          fill="url(#swirl_vanilla)" stroke="#FEF08A" stroke-width="2" />

    <!-- Swirl Tier 3: Mint Cyan Ice (Top) -->
    <path d="M 198 168 C 190 145, 215 120, 245 120 C 275 120, 305 135, 300 160 C 290 175, 245 175, 198 168 Z" 
          fill="url(#swirl_cyan)" stroke="#0284C7" stroke-width="2" />

    <!-- Soft Cream Tip (Whipped Cream Peak) -->
    <path d="M 238 122 C 235 105, 245 80, 262 72 C 267 70, 272 74, 270 80 C 265 92, 275 105, 270 120 Z" 
          fill="#FFFFFF" />

    <!-- 3. TRANSLATION PUDDING FLAG (Lá cờ dịch thuật cắm trên đỉnh kem) -->
    <line x1="285" y1="65" x2="285" y2="150" stroke="#64748B" stroke-width="4" stroke-linecap="round" />
    <path d="M 285 65 L 360 65 L 345 85 L 360 105 L 285 105 Z" fill="#0284C7" />
    <!-- 'CT' Logo on Flag -->
    <text x="316" y="91" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
          font-size="20" font-weight="900" fill="#FFFFFF" text-anchor="middle">CT</text>
  </g>

  <!-- Twinkle Stars -->
  <polygon points="385,150 390,162 402,167 390,172 385,184 380,172 368,167 380,162" fill="#FBBF24" />
</svg>
