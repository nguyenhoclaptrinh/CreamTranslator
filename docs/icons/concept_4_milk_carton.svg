<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="c4_bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="c4_carton" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F1F5F9" />
    </linearGradient>
    <linearGradient id="c4_blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <filter id="c4_glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#0284C7" flood-opacity="0.45" />
    </filter>
  </defs>

  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#c4_bg)" stroke="#1E293B" stroke-width="4" />

  <g filter="url(#c4_glow)" transform="translate(0, -10)">
    <!-- Diagonal Straw (Ống hút sọc chéo dễ thương) -->
    <line x1="280" y1="90" x2="220" y2="190" stroke="#F43F5E" stroke-width="12" stroke-linecap="round" />
    <line x1="272" y1="102" x2="260" y2="122" stroke="#FFFFFF" stroke-width="12" />

    <!-- Milk Carton Roof Peak (Nóc hộp sữa giấy) -->
    <polygon points="170,190 256,130 342,190" fill="#E2E8F0" stroke="#CBD5E1" stroke-width="3" />
    <rect x="210" y="120" width="92" height="18" rx="4" fill="#94A3B8" />

    <!-- Carton Body (Thân hộp sữa vuông vắn) -->
    <rect x="170" y="190" width="172" height="190" rx="8" fill="url(#c4_carton)" stroke="#CBD5E1" stroke-width="3" />

    <!-- Blue Label Wave (Dải sóng kem sữa xanh) -->
    <path d="M 170 230 Q 210 215 256 230 Q 300 245 342 230 L 342 320 Q 300 335 256 320 Q 210 305 170 320 Z" fill="url(#c4_blue)" />

    <!-- Cute Japanese / Manga 'CREAM' typography -->
    <text x="256" y="275" font-family="sans-serif" font-size="24" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">CREAM</text>
    
    <!-- Translation Dual Arrows -->
    <g stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M 226 295 L 286 295 M 276 288 L 286 295 L 276 302" />
      <path d="M 286 308 L 226 308 M 236 301 L 226 308 L 236 315" />
    </g>

    <!-- Fresh Milk Drop Badge -->
    <ellipse cx="256" cy="355" rx="14" ry="18" fill="#38BDF8" />
    <polygon points="256,332 245,348 267,348" fill="#38BDF8" />
    <circle cx="252" cy="352" r="3" fill="#FFFFFF" />
  </g>
</svg>
