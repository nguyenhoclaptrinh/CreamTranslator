<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Bright Pastel Mint & Vanilla Gradient -->
    <linearGradient id="cone3_bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EFF6FF" />
      <stop offset="50%" stop-color="#F0FDF4" />
      <stop offset="100%" stop-color="#FEF9C3" />
    </linearGradient>

    <!-- Golden Cone Gradient -->
    <linearGradient id="cone3_waffle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <!-- Geometric Cream Top -->
    <linearGradient id="cone3_cream" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#FFF1F2" />
    </linearGradient>

    <filter id="cone3_shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#0284C7" flood-opacity="0.25" />
    </filter>
  </defs>

  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#cone3_bg)" stroke="#FFFFFF" stroke-width="8" />

  <g filter="url(#cone3_shadow)" transform="translate(0, -6)">
    <!-- 1. CRISPY CONE (Ốc quế phẳng tối giản hình học) -->
    <path d="M 170 240 L 342 240 L 264 425 C 260 433, 252 433, 248 425 Z" 
          fill="url(#cone3_waffle)" stroke="#B45309" stroke-width="4" />

    <!-- Clean Geometric Grid Lines -->
    <g stroke="#78350F" stroke-width="3" opacity="0.4" stroke-linecap="round">
      <line x1="200" y1="240" x2="260" y2="415" />
      <line x1="240" y1="240" x2="280" y2="365" />
      <line x1="280" y1="240" x2="310" y2="330" />

      <line x1="312" y1="240" x2="252" y2="415" />
      <line x1="272" y1="240" x2="232" y2="365" />
      <line x1="232" y1="240" x2="202" y2="330" />
    </g>

    <!-- 2. GEOMETRIC CREAM CLOUD / ROUNDED SOFT-SERVE FLUTES -->
    <!-- Triple Round Flutes over the cone rim -->
    <circle cx="196" cy="225" r="44" fill="url(#cone3_cream)" stroke="#FDA4AF" stroke-width="3" />
    <circle cx="316" cy="225" r="44" fill="url(#cone3_cream)" stroke="#FDA4AF" stroke-width="3" />
    <circle cx="256" cy="180" r="54" fill="#FFFFFF" stroke="#FDA4AF" stroke-width="3" />

    <!-- Strawberry Chocolate Dip Glaze (Lớp sốt dâu đỏ tươi phủ bóng) -->
    <path d="M 215 150 Q 235 180 256 160 Q 275 180 297 150 Q 285 205 256 195 Q 227 205 215 150 Z" 
          fill="#FB7185" />

    <!-- Cute Swirl Tip -->
    <path d="M 256 128 C 248 110, 252 90, 268 85 C 272 98, 264 115, 256 128 Z" 
          fill="#FFFFFF" />

    <!-- 3. TRANSLATION ARROWS HERO (2 Mũi tên dịch thuật đậm nét, nổi bật tuyệt đối) -->
    <g transform="translate(196, 205)">
      <!-- Central Background Plate for High Visibility -->
      <rect x="0" y="0" width="120" height="48" rx="24" fill="#0284C7" />

      <!-- Left-to-Right Arrow (White) -->
      <path d="M 25 18 L 65 18 M 55 12 L 65 18 L 55 24" 
            stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />

      <!-- Right-to-Left Arrow (Yellow) -->
      <path d="M 95 30 L 55 30 M 65 24 L 55 30 L 65 36" 
            stroke="#FEF08A" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    </g>
  </g>

  <!-- Twinkle Stars -->
  <polygon points="100,105 105,117 118,122 105,127 100,139 95,127 82,122 95,117" fill="#F59E0B" />
</svg>
