<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="c2_bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="c2_glass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.1" />
    </linearGradient>
    <linearGradient id="c2_scoop1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#FEF08A" />
    </linearGradient>
    <linearGradient id="c2_scoop2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7DD3FC" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <filter id="c2_glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#0284C7" flood-opacity="0.5" />
    </filter>
  </defs>

  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#c2_bg)" stroke="#1E293B" stroke-width="4" />

  <g filter="url(#c2_glow)" transform="translate(0, -10)">
    <!-- Glass Coupe Bowl (Ly thủy tinh cao cấp) -->
    <!-- Base Foot -->
    <ellipse cx="256" cy="400" rx="60" ry="14" fill="#64748B" opacity="0.6" />
    <!-- Stem -->
    <rect x="248" y="320" width="16" height="80" rx="8" fill="#94A3B8" opacity="0.8" />
    <!-- Coupe Cup -->
    <path d="M 160 220 Q 160 320 256 320 Q 352 320 352 220 Z" fill="url(#c2_glass)" stroke="#38BDF8" stroke-width="4" />

    <!-- Scoop 1: Vanilla Cream (Left Round Scoop) -->
    <circle cx="216" cy="200" r="54" fill="url(#c2_scoop1)" />
    <!-- Scoop 2: Cyan Berry Ice (Right Round Scoop) -->
    <circle cx="296" cy="200" r="54" fill="url(#c2_scoop2)" />

    <!-- Top Scoop: Whipped Cream Crown -->
    <ellipse cx="256" cy="165" rx="42" ry="26" fill="#FFFFFF" />

    <!-- Translation Silver Spoon / Arrow -->
    <path d="M 230 110 L 310 250" stroke="#F8FAFC" stroke-width="8" stroke-linecap="round" />
    <!-- Spoon Head / Translation Symbol -->
    <circle cx="316" cy="260" r="14" fill="#38BDF8" stroke="#FFFFFF" stroke-width="3" />

    <!-- Letters on the scoops -->
    <text x="216" y="210" font-family="sans-serif" font-size="28" font-weight="900" fill="#334155" text-anchor="middle">EN</text>
    <text x="296" y="210" font-family="sans-serif" font-size="28" font-weight="900" fill="#FFFFFF" text-anchor="middle">VI</text>

    <!-- Star Berry Garnish -->
    <polygon points="256,120 262,132 276,134 266,144 268,158 256,150 244,158 246,144 236,134 250,132" fill="#F43F5E" />
  </g>
</svg>
