<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Kawaii Anime Soft Sky & Strawberry Gradient -->
    <linearGradient id="ani3_bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E0F2FE" />
      <stop offset="60%" stop-color="#FCE7F3" />
      <stop offset="100%" stop-color="#FFE4E6" />
    </linearGradient>

    <!-- Milk Carton Body Gradient -->
    <linearGradient id="ani3_carton" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#FFF1F2" />
    </linearGradient>

    <!-- Strawberry Pink Band -->
    <linearGradient id="ani3_pink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FB7185" />
      <stop offset="100%" stop-color="#F43F5E" />
    </linearGradient>

    <filter id="cartonShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#FDA4AF" flood-opacity="0.45" />
    </filter>
  </defs>

  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#ani3_bg)" stroke="#FFFFFF" stroke-width="8" />

  <g filter="url(#cartonShadow)" transform="translate(0, -10)">
    <!-- Cute Striped Straw (Ống hút sọc hồng trắng cắm nghiêng) -->
    <line x1="290" y1="80" x2="225" y2="190" stroke="#F43F5E" stroke-width="14" stroke-linecap="round" />
    <line x1="282" y1="94" x2="270" y2="114" stroke="#FFFFFF" stroke-width="14" />
    <line x1="256" y1="138" x2="244" y2="158" stroke="#FFFFFF" stroke-width="14" />

    <!-- Carton Roof (Mái hộp sữa) -->
    <polygon points="160,195 256,125 352,195" fill="#FFE4E6" stroke="#FDA4AF" stroke-width="3" />
    <rect x="205" y="115" width="102" height="20" rx="4" fill="#F43F5E" />

    <!-- Carton Main Body (Thân hộp sữa vuông bo góc mềm mại) -->
    <rect x="160" y="195" width="192" height="210" rx="16" fill="url(#ani3_carton)" stroke="#FDA4AF" stroke-width="4" />

    <!-- Wavy Strawberry Milk Wave (Dải sóng sữa dâu hồng pastel) -->
    <path d="M 160 235 Q 208 220 256 235 Q 304 250 352 235 L 352 335 Q 304 350 256 335 Q 208 320 160 335 Z" fill="url(#ani3_pink)" />

    <!-- Cute Kawaii Anime Face (Mặt cười anime đáng yêu trên thân hộp) -->
    <!-- Left Eye (Happy curved anime arch) -->
    <path d="M 205 275 Q 220 260 235 275" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" fill="none" />
    <!-- Right Eye -->
    <path d="M 277 275 Q 292 260 307 275" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" fill="none" />
    <!-- Cute Open Mouth -->
    <path d="M 248 290 Q 256 302 264 290 Z" fill="#FFE4E6" stroke="#FFFFFF" stroke-width="2" />
    <!-- Pink Blush Cheeks (Má hồng đào) -->
    <ellipse cx="205" cy="290" rx="10" ry="6" fill="#FDA4AF" opacity="0.8" />
    <ellipse cx="307" cy="290" rx="10" ry="6" fill="#FDA4AF" opacity="0.8" />

    <!-- Translation Dialogue Badge on the bottom (Bảng dịch thuật chữ nhật tròn) -->
    <rect x="195" y="348" width="122" height="42" rx="12" fill="#FFFFFF" stroke="#0EA5E9" stroke-width="3" />
    <!-- Dual translation arrows inside -->
    <text x="225" y="376" font-family="sans-serif" font-size="20" font-weight="900" fill="#0284C7" text-anchor="middle">EN</text>
    <path d="M 244 369 L 268 369 M 262 363 L 268 369 L 262 375" stroke="#F43F5E" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <text x="287" y="376" font-family="sans-serif" font-size="20" font-weight="900" fill="#E11D48" text-anchor="middle">VI</text>
  </g>

  <!-- Floating Anime Hearts & Stars -->
  <path d="M 390 190 C 390 175, 410 175, 410 190 C 410 205, 390 220, 390 220 C 390 220, 370 205, 370 190 C 370 175, 390 175, 390 190 Z" fill="#F43F5E" />
  <polygon points="110,130 115,142 128,147 115,152 110,164 105,152 92,147 105,142" fill="#FBBF24" />
</svg>
