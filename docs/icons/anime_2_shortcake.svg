<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Bright Pastel Mint & Vanilla Gradient -->
    <linearGradient id="ani2_bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF9C3" />
      <stop offset="50%" stop-color="#FFFBEB" />
      <stop offset="100%" stop-color="#DCFCE7" />
    </linearGradient>

    <!-- Sponge Cake Yellow -->
    <linearGradient id="ani2_cake" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>

    <filter id="cakeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#F59E0B" flood-opacity="0.35" />
    </filter>
  </defs>

  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#ani2_bg)" stroke="#FFFFFF" stroke-width="8" />

  <g filter="url(#cakeShadow)" transform="translate(0, 10)">
    <!-- Cute Cake Plate (Đĩa bánh sứ trắng viền pastel) -->
    <ellipse cx="256" cy="360" rx="170" ry="45" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="4" />
    <ellipse cx="256" cy="358" rx="145" ry="34" fill="#F8FAFC" />

    <!-- Anime Shortcake Slice Body (Miếng bánh kem dâu tam giác kiểu Nhật) -->
    <!-- Cake Sponge Layer 1 (Đáy bánh) -->
    <path d="M 130 310 L 370 290 L 370 330 L 130 350 Z" fill="url(#ani2_cake)" />

    <!-- Cream Middle Layer (Lớp kem tươi giữa kẹp dâu) -->
    <path d="M 130 280 L 370 260 L 370 290 L 130 310 Z" fill="#FFFFFF" />
    <!-- Sliced Strawberries inside cream -->
    <circle cx="200" cy="295" r="10" fill="#E11D48" />
    <circle cx="270" cy="285" r="10" fill="#E11D48" />
    <circle cx="330" cy="275" r="10" fill="#E11D48" />

    <!-- Cake Sponge Layer 2 (Lớp bánh trên) -->
    <path d="M 130 250 L 370 230 L 370 260 L 130 280 Z" fill="url(#ani2_cake)" />

    <!-- Thick Whipped Cream Frosting on Top (Lớp kem tươi dày phủ trên mặt) -->
    <path d="M 130 250 L 370 230 L 310 180 L 130 200 Z" fill="#FFFFFF" stroke="#F1F5F9" stroke-width="2" />
    <!-- Cream Drips cascading down the side -->
    <path d="M 130 250 Q 150 270 170 250 Q 200 275 230 250 Q 270 270 300 245 L 370 230 L 370 240 Q 300 255 270 250 Q 200 285 170 260 L 130 255 Z" fill="#FFFFFF" />

    <!-- Big Fresh Whole Strawberry on Top (Quả dâu tây tươi trên đỉnh bánh) -->
    <g transform="translate(200, 120)">
      <path d="M 40 10 C 15 10, 10 50, 40 70 C 70 50, 65 10, 40 10 Z" fill="#E11D48" />
      <polygon points="40,10 28,0 40,5 52,0" fill="#22C55E" />
      <circle cx="34" cy="30" r="2" fill="#FEF08A" />
      <circle cx="48" cy="32" r="2" fill="#FEF08A" />
      <circle cx="40" cy="48" r="2" fill="#FEF08A" />
    </g>

    <!-- Glowing Translation Flag / Banner sticking out of the cake (Cờ dịch thuật cắm trên bánh) -->
    <line x1="310" y1="130" x2="310" y2="210" stroke="#94A3B8" stroke-width="4" stroke-linecap="round" />
    <!-- Flag Body -->
    <path d="M 310 130 L 380 130 L 365 150 L 380 170 L 310 170 Z" fill="#38BDF8" />
    <!-- 'CT' text on flag -->
    <text x="338" y="156" font-family="sans-serif" font-size="20" font-weight="900" fill="#FFFFFF" text-anchor="middle">CT</text>
  </g>

  <!-- Anime Twinkle Stars -->
  <polygon points="390,90 395,102 408,107 395,112 390,124 385,112 372,107 385,102" fill="#F59E0B" />
  <polygon points="90,180 94,190 104,194 94,198 90,208 86,198 76,194 86,190" fill="#FB7185" />
</svg>
