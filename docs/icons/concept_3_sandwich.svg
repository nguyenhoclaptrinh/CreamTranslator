<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="c3_bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A1128" />
      <stop offset="100%" stop-color="#1C2541" />
    </linearGradient>
    <linearGradient id="c3_wafer" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>
    <linearGradient id="c3_icecream" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#FFFBEB" />
      <stop offset="100%" stop-color="#BAE6FD" />
    </linearGradient>
    <filter id="c3_glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#38BDF8" flood-opacity="0.35" />
    </filter>
  </defs>

  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#c3_bg)" stroke="#334155" stroke-width="4" />

  <g filter="url(#c3_glow)" transform="translate(0, 10)">
    <!-- Top Cookie Wafer (Thanh bánh quy trên) -->
    <rect x="120" y="150" width="272" height="44" rx="22" fill="url(#c3_wafer)" stroke="#F59E0B" stroke-width="3" />
    <!-- Wafer Dots Grid -->
    <circle cx="160" cy="172" r="4" fill="#78350F" opacity="0.6" />
    <circle cx="208" cy="172" r="4" fill="#78350F" opacity="0.6" />
    <circle cx="256" cy="172" r="4" fill="#78350F" opacity="0.6" />
    <circle cx="304" cy="172" r="4" fill="#78350F" opacity="0.6" />
    <circle cx="352" cy="172" r="4" fill="#78350F" opacity="0.6" />

    <!-- Thick Ice Cream Layer (Khối kem dày mịn ở giữa) -->
    <rect x="130" y="190" width="252" height="96" rx="16" fill="url(#c3_icecream)" />

    <!-- Holographic Translation Display inside Cream -->
    <rect x="156" y="206" width="200" height="64" rx="12" fill="#0F172A" opacity="0.85" stroke="#38BDF8" stroke-width="2" />
    <!-- Logo Monogram 'C' and 'T' -->
    <text x="210" y="250" font-family="sans-serif" font-size="34" font-weight="900" fill="#FFFBEB" text-anchor="middle">C</text>
    <!-- Arrow -->
    <path d="M 235 240 L 275 240 M 265 232 L 275 240 L 265 248" stroke="#00E5FF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <text x="300" y="250" font-family="sans-serif" font-size="34" font-weight="900" fill="#38BDF8" text-anchor="middle">T</text>

    <!-- Bottom Cookie Wafer (Thanh bánh quy dưới) -->
    <rect x="120" y="282" width="272" height="44" rx="22" fill="url(#c3_wafer)" stroke="#F59E0B" stroke-width="3" />
    <!-- Wafer Dots Grid -->
    <circle cx="160" cy="304" r="4" fill="#78350F" opacity="0.6" />
    <circle cx="208" cy="304" r="4" fill="#78350F" opacity="0.6" />
    <circle cx="256" cy="304" r="4" fill="#78350F" opacity="0.6" />
    <circle cx="304" cy="304" r="4" fill="#78350F" opacity="0.6" />
    <circle cx="352" cy="304" r="4" fill="#78350F" opacity="0.6" />
  </g>
</svg>
