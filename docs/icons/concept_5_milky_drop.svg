<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="c5_bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="c5_drop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#FFF7ED" />
      <stop offset="100%" stop-color="#FED7AA" />
    </linearGradient>
    <linearGradient id="c5_ripple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#00E5FF" />
    </linearGradient>
    <filter id="c5_glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#00E5FF" flood-opacity="0.4" />
    </filter>
  </defs>

  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#c5_bg)" stroke="#1E293B" stroke-width="4" />

  <g filter="url(#c5_glow)" transform="translate(0, 10)">
    <!-- Splash Ripple Ring (Vòng sóng gợn sữa kem) -->
    <ellipse cx="256" cy="340" rx="140" ry="40" fill="none" stroke="url(#c5_ripple)" stroke-width="4" opacity="0.6" />
    <ellipse cx="256" cy="340" rx="90" ry="25" fill="none" stroke="#FFFFFF" stroke-width="3" opacity="0.8" />

    <!-- Pure Cream Splash Droplet (Giọt sữa kem tươi tinh khiết) -->
    <path d="M 256 120 C 256 120, 170 260, 170 300 C 170 348, 208 370, 256 370 C 304 370, 342 348, 342 300 C 342 260, 256 120, 256 120 Z" 
          fill="url(#c5_drop)" />

    <!-- Glossy Highlight on Drop -->
    <path d="M 230 180 C 215 210, 200 250, 200 280 C 200 295, 205 310, 215 315 C 205 305, 205 285, 215 260 C 225 235, 240 200, 240 180 Z" 
          fill="#FFFFFF" opacity="0.75" />

    <!-- High-tech Translation HUD Core inside Droplet -->
    <circle cx="260" cy="295" r="36" fill="#0F172A" stroke="#00E5FF" stroke-width="3" />
    <!-- Monogram 'CT' in HUD -->
    <text x="260" y="306" font-family="sans-serif" font-size="28" font-weight="900" fill="#00E5FF" text-anchor="middle">CT</text>

    <!-- Mini satellite splash droplets -->
    <circle cx="160" cy="290" r="10" fill="url(#c5_drop)" />
    <circle cx="350" cy="275" r="8" fill="url(#c5_drop)" />
  </g>
</svg>
