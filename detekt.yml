build:
  maxIssues: 0
  excludeCorrectable: false

complexity:
  TooManyFunctions:
    active: false
  LongMethod:
    threshold: 120
  ComplexCondition:
    threshold: 5
  NestedBlockDepth:
    threshold: 5

exceptions:
  TooGenericExceptionCaught:
    active: false

style:
  MagicNumber:
    active: false
  ReturnCount:
    active: false
  UnusedPrivateProperty:
    active: true

naming:
  FunctionNaming:
    active: true
    functionPattern: '^([a-z][a-zA-Z0-9]*|[A-Z][a-zA-Z0-9]*)$'
    ignoreAnnotated: ['Composable']
  VariableNaming:
    active: true
    variablePattern: '^[a-z][a-zA-Z0-9]*$'
