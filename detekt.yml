build:
  maxIssues: 0
  excludeCorrectable: false

complexity:
  TooManyFunctions:
    active: false
  LongParameterList:
    ignoreAnnotated: ['Composable']
  LongMethod:
    threshold: 120
  ComplexCondition:
    threshold: 5
  NestedBlockDepth:
    threshold: 5

exceptions:
  TooGenericExceptionCaught:
    active: true

style:
  ForbiddenComment:
    active: true
    comments:
      - 'TODO:'
      - 'FIXME:'
      - 'STOPSHIP:'
      - 'HACK:'
      - 'TEMP:'
  MagicNumber:
    active: false
  ReturnCount:
    active: false
  UnusedPrivateProperty:
    active: true

naming:
  FunctionNaming:
    active: true
    functionPattern: '^([a-z][a-zA-Z0-9]*|[A-Z][a-zA-Z0-9]*)$'
    ignoreAnnotated: ['Composable']
  VariableNaming:
    active: true
    variablePattern: '^[a-z][a-zA-Z0-9]*$'
